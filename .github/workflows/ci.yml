name: C Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and Test
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libcriterion-dev valgrind
      - run: make test
